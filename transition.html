<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla de transicion - XavoDraw</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@500;700;900&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#05070c;
    --bg-panel: rgba(20,26,38,0.72);
    --bg-panel-solid:#141a26;
    --bg-panel2: rgba(28,39,64,0.65);
    --red:#e8232e;
    --red-bright:#ff4b56;
    --cyan:#3fd8f5;
    --cyan-bright:#5fd4ff;
    --blue:#0a6cff;
    --purple:#9b4dff;
    --text:#edf1f7;
    --mute:#8592a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:'Nunito Sans', sans-serif;
    background:var(--bg-deep);
  }
  .stage{ position:absolute; top:0; left:0; width:1080px; height:1920px; transform-origin:top left; }

  .clip-tl-br{ clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px); }
  .clip-both{ clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px); }

  @keyframes gridDrift{ 0%{background-position:0 0;} 100%{background-position:56px 112px;} }
  @keyframes floorMove{ from{background-position-y:0;} to{background-position-y:90px;} }
  @keyframes particleFloat{ 0%,100%{transform:translateY(0); opacity:.2;} 50%{transform:translateY(-18px); opacity:1;} }
  @keyframes scan{ 0%{transform:translateX(-120%);} 100%{transform:translateX(120%);} }
  @keyframes glowPulse{
    0%,100%{ text-shadow:0 0 16px rgba(63,216,245,0.5), 0 3px 0 rgba(0,0,0,0.6); }
    50%{ text-shadow:0 0 32px rgba(63,216,245,0.85), 0 3px 0 rgba(0,0,0,0.6); }
  }
  @keyframes flicker{ 0%,100%{opacity:1;} 92%{opacity:1;} 93%{opacity:.75;} 94%{opacity:1;} }

  /* ---------- fondo animado a pantalla completa ---------- */
  .tron-full{
    position:absolute; inset:0; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 28%, rgba(63,216,245,0.14), transparent 55%),
      linear-gradient(180deg, #05070c 0%, #0b0d12 45%, #05070c 100%);
  }
  .tron-full .sky-grid{
    position:absolute; top:0; left:-40px; right:-40px; height:55%;
    background-image:
      linear-gradient(rgba(63,216,245,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,216,245,0.10) 1px, transparent 1px);
    background-size:56px 56px;
    animation: gridDrift 9s linear infinite;
    mask-image: linear-gradient(to bottom, black, transparent);
  }
  .tron-full .floor-grid{
    position:absolute; left:-50%; right:-50%; bottom:0; height:52%;
    background-image:
      linear-gradient(rgba(63,216,245,0.32) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,216,245,0.32) 1px, transparent 1px);
    background-size:90px 90px;
    transform: perspective(500px) rotateX(62deg);
    transform-origin: bottom;
    animation: floorMove 2.6s linear infinite;
    mask-image: linear-gradient(to top, black 30%, transparent 92%);
  }
  .tron-full .horizon{
    position:absolute; left:0; right:0; top:48%; height:2px;
    background:linear-gradient(90deg, transparent, rgba(95,212,255,0.9), transparent);
    box-shadow:0 0 24px rgba(63,216,245,0.7);
  }
  .tron-full .sweep{
    position:absolute; top:0; bottom:0; width:220px;
    background:linear-gradient(90deg, transparent, rgba(95,212,255,0.10), transparent);
    animation: scan 7s linear infinite;
  }
  .tron-full .particle{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:var(--cyan-bright);
    box-shadow:0 0 10px var(--cyan-bright), 0 0 20px var(--cyan-bright);
    animation: particleFloat 3.6s ease-in-out infinite;
  }
  .tron-full .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  .flag-badge{
    position:absolute; top:64px; right:64px;
    width:80px; height:80px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-panel2);
    border:1.5px solid rgba(63,216,245,0.5);
    padding:10px;
    box-shadow:0 0 18px rgba(63,216,245,0.25);
  }
  .flag-badge img{ width:100%; height:64%; object-fit:cover; box-shadow:0 0 6px rgba(0,0,0,0.6); }

  .character{
    position:absolute; left:50%; top:560px; width:760px; height:760px;
    transform:translateX(-50%);
  }
  .character img{
    width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 0 40px rgba(63,216,245,0.35)) drop-shadow(0 20px 30px rgba(0,0,0,0.6));
  }

  .msg-block{
    position:absolute; left:0; right:0; top:1300px;
    text-align:center; padding:0 60px;
  }
  .msg-block .tag{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:6px;
    color:var(--cyan-bright);
    text-transform:uppercase;
    margin-bottom:18px;
    animation: flicker 4s ease-in-out infinite;
  }
  .msg-block .tag::before{ content:"\25C6  "; color:var(--red-bright); }
  .msg-block .tag::after{ content:"  \25C6"; color:var(--red-bright); }
  .msg-block .title{
    font-family:'Bungee', sans-serif;
    font-size:76px;
    line-height:1.15;
    color:var(--text);
    animation: glowPulse 3.5s ease-in-out infinite;
  }
  .msg-block .subtitle{
    margin-top:26px;
    font-family:'Nunito Sans', sans-serif;
    font-weight:600;
    font-size:30px;
    color:var(--mute);
  }

  .social-row{
    position:absolute; left:0; right:0; bottom:120px;
    display:flex; align-items:center; justify-content:center; gap:18px;
  }
  .social-row .chip{
    background:var(--bg-panel-solid);
    border:1.5px solid rgba(63,216,245,0.5);
    padding:14px 26px;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:2px;
    color:var(--cyan-bright);
    box-shadow:0 0 14px rgba(63,216,245,0.2);
  }
  .social-row .chip.handle{
    color:#fff;
    border-color:rgba(255,75,86,0.6);
    text-shadow:0 0 10px var(--cyan-bright);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="tron-full">
      <div class="sky-grid"></div>
      <div class="floor-grid"></div>
      <div class="horizon"></div>
      <div class="sweep"></div>
      <div class="vignette"></div>
      <div class="particle" style="left:15%; top:22%; animation-delay:0s;"></div>
      <div class="particle" style="left:80%; top:18%; animation-delay:.9s;"></div>
      <div class="particle" style="left:88%; top:38%; animation-delay:1.8s;"></div>
      <div class="particle" style="left:10%; top:42%; animation-delay:2.6s;"></div>
      <div class="particle" style="left:50%; top:15%; animation-delay:1.3s;"></div>
    </div>

    <div class="flag-badge clip-tl-br"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Flag_of_Ecuador.svg" alt="Ecuador"></div>

    <div class="character">
      <img src="assets/xavodraw-saludo.png" alt="XavoDraw">
    </div>

    <div class="msg-block">
      <div class="tag">XavoDraw</div>
      <div class="title" id="title">¡VOLVEMOS EN<br>UNOS MINUTOS!</div>
      <div class="subtitle" id="subtitle"></div>
    </div>

    <div class="social-row">
      <div class="chip handle">EN TODAS MIS REDES: @XAVODRAW</div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const title = params.get('title');
  const subtitle = params.get('subtitle');
  if (title) document.getElementById('title').innerHTML = title.replace(/\n/g,'<br>');
  if (subtitle) document.getElementById('subtitle').textContent = subtitle;

  function fitStage(){
    const stage = document.querySelector('.stage');
    const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    const offsetX = (window.innerWidth - 1080 * scale) / 2;
    const offsetY = (window.innerHeight - 1920 * scale) / 2;
    stage.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
</body>
</html>
