<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay TikTok - Marvel Rivals - XavoDraw</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@500;700;900&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0b0d12;
    --bg-panel: rgba(20,26,38,0.72);
    --bg-panel-solid:#141a26;
    --bg-panel2: rgba(28,39,64,0.65);
    --red:#e8232e;
    --red-bright:#ff4b56;
    --cyan:#3fd8f5;
    --cyan-bright:#5fd4ff;
    --blue:#0a6cff;
    --purple:#9b4dff;
    --text:#edf1f7;
    --mute:#8592a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:1080px;
    height:1920px;
    background:transparent;
    overflow:hidden;
    font-family:'Nunito Sans', sans-serif;
  }
  body.preview{
    background:
      radial-gradient(ellipse at 30% 20%, #1a2f4a 0%, transparent 55%),
      linear-gradient(160deg,#05070c 0%, #0d1420 45%, #0a0f18 100%);
  }
  body.preview::before{
    content:"VISTA PREVIA \2014 EN OBS / TIKTOK STUDIO ESTO ES TRANSPARENTE";
    position:absolute;
    top:860px; left:0; right:0;
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-size:15px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.18);
    text-transform:uppercase;
  }

  .stage{ position:relative; width:1080px; height:1920px; }

  /* ---------- shared HUD panel look ---------- */
  .hud-panel{
    background:var(--bg-panel);
    border:1.5px solid rgba(63,216,245,0.55);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 0 22px rgba(63,216,245,0.25),
      inset 0 0 18px rgba(63,216,245,0.06);
    backdrop-filter: blur(2px);
  }
  .clip-tl-br{ clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px); }
  .clip-both{ clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px); }

  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 0 18px rgba(63,216,245,0.22), inset 0 0 16px rgba(63,216,245,0.05); }
    50%{ box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 0 34px rgba(63,216,245,0.5), inset 0 0 22px rgba(63,216,245,0.12); }
  }
  @keyframes scan{
    0%{ transform:translateX(-110%); }
    100%{ transform:translateX(110%); }
  }
  @keyframes bracketPulse{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }
  @keyframes gridDrift{
    0%{ background-position: 0 0; }
    100%{ background-position: 48px 96px; }
  }
  @keyframes particleFloat{
    0%,100%{ transform:translateY(0); opacity:.25; }
    50%{ transform:translateY(-14px); opacity:1; }
  }

  /* ---------- animated Tron grid (fondo compacto, detras del personaje) ---------- */
  .tron-grid{
    position:absolute; inset:0; overflow:hidden;
  }
  .tron-grid::before{
    content:"";
    position:absolute; inset:-40px;
    background-image:
      linear-gradient(rgba(63,216,245,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,216,245,0.16) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridDrift 6s linear infinite;
    mask-image: radial-gradient(ellipse at 35% 40%, black 35%, transparent 80%);
  }
  .tron-grid .particle{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:var(--cyan-bright);
    box-shadow:0 0 8px var(--cyan-bright), 0 0 16px var(--cyan-bright);
    animation: particleFloat 3.2s ease-in-out infinite;
  }

  /* ---------- TOP TITLE BAR ---------- */
  .top-bar{
    position:absolute; top:250px; left:40px; right:40px; height:170px;
    animation: glowPulse 4s ease-in-out infinite;
    display:flex; align-items:center; padding:0 34px;
    overflow:hidden;
  }
  .top-bar::after{
    content:"";
    position:absolute; top:0; bottom:0; width:120px;
    background:linear-gradient(90deg, transparent, rgba(95,212,255,0.18), transparent);
    animation: scan 5s linear infinite;
  }
  .top-bar .accent-bar{
    width:6px; align-self:stretch; margin-right:22px; flex-shrink:0;
    background:linear-gradient(180deg, var(--cyan-bright), var(--blue));
    box-shadow:0 0 12px rgba(63,216,245,0.8);
  }
  .top-bar .text-block{ flex:1; min-width:0; }
  .tag{
    font-family:'Nunito Sans', sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:5px;
    color:var(--cyan-bright);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .tag::before{ content:"\25C6  "; color:var(--red-bright); }
  .title{
    font-family:'Bungee', sans-serif;
    font-size:54px;
    line-height:1;
    color:var(--text);
    text-shadow:0 0 14px rgba(63,216,245,0.55), 0 2px 0 rgba(0,0,0,0.6);
    letter-spacing:1px;
    white-space:nowrap;
  }
  .subtitle{
    margin-top:10px;
    font-family:'Nunito Sans', sans-serif;
    font-weight:600;
    font-size:22px;
    color:var(--mute);
    letter-spacing:.5px;
  }
  .flag-badge{
    flex-shrink:0;
    width:74px; height:74px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-panel2);
    border:1.5px solid rgba(63,216,245,0.5);
    margin-left:20px;
    padding:10px;
  }
  .flag-badge img{
    width:100%; height:64%; object-fit:cover;
    box-shadow:0 0 6px rgba(0,0,0,0.6);
  }

  /* ---------- CHARACTER HUD FRAME ---------- */
  .char-frame{
    position:absolute; left:40px; top:460px; width:460px; height:520px;
    background:linear-gradient(180deg, rgba(20,26,38,0.15), rgba(11,13,18,0.55) 80%);
    border:1.5px solid rgba(63,216,245,0.5);
    animation: glowPulse 4s ease-in-out infinite 1s;
    overflow:hidden;
  }
  .char-frame iframe{
    position:absolute; inset:0; width:100%; height:100%;
    border:0; background:transparent;
  }
  .char-label{
    position:absolute; top:14px; left:16px;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:2px;
    color:var(--cyan-bright);
    background:rgba(5,7,10,0.55);
    padding:6px 12px;
    border-left:3px solid var(--red-bright);
    z-index:2;
  }
  .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--red-bright); margin-right:8px;
    box-shadow:0 0 8px var(--red-bright);
  }
  .corner{
    position:absolute; width:34px; height:34px;
    border:3px solid var(--cyan-bright);
    animation: bracketPulse 2.4s ease-in-out infinite;
    z-index:2;
  }
  .corner.tl{ top:-2px; left:-2px; border-right:none; border-bottom:none; }
  .corner.tr{ top:-2px; right:-2px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:-2px; left:-2px; border-right:none; border-top:none; }
  .corner.br{ bottom:-2px; right:-2px; border-left:none; border-top:none; }

  /* ---------- USERNAME CHIP ---------- */
  .username-chip{
    position:absolute; left:40px; top:884px; width:340px; height:76px;
    background:var(--bg-panel-solid);
    border:1.5px solid rgba(63,216,245,0.6);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 20px rgba(63,216,245,0.3);
  }
  .username-chip span{
    font-family:'Bungee', sans-serif;
    font-size:30px;
    color:#fff;
    letter-spacing:1px;
    text-shadow:
      0 0 6px #fff,
      0 0 16px var(--cyan-bright),
      0 0 30px var(--cyan-bright);
  }

  /* ---------- TRACKER.GG DOCK (marco fijo; el widget real va como otra fuente Link
     en TikTok Studio, ubicada/redimensionada para calzar exacto en este hueco) ---------- */
  .tracker-dock{
    position:absolute; left:560px; top:460px; width:404px; height:280px;
    background:linear-gradient(180deg, rgba(20,26,38,0.12), rgba(11,13,18,0.4) 80%);
    border:1.5px solid rgba(63,216,245,0.5);
    animation: glowPulse 4s ease-in-out infinite 0.5s;
  }
  .tracker-dock .dock-label{
    position:absolute; top:14px; left:16px;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:2px;
    color:var(--cyan-bright);
    background:rgba(5,7,10,0.55);
    padding:6px 12px;
    border-left:3px solid var(--red-bright);
  }
</style>
</head>
<body>
  <div class="stage">

    <div class="top-bar hud-panel clip-both">
      <div class="accent-bar"></div>
      <div class="text-block">
        <div class="tag">Marvel Rivals</div>
        <div class="title">RANKED Y QP</div>
        <div class="subtitle">Tips y buenos dibujos mientras juego</div>
      </div>
      <div class="flag-badge clip-tl-br"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Flag_of_Ecuador.svg" alt="Ecuador"></div>
    </div>

    <div class="char-frame clip-both">
      <div class="tron-grid">
        <div class="particle" style="left:12%; top:20%; animation-delay:0s;"></div>
        <div class="particle" style="left:82%; top:35%; animation-delay:.8s;"></div>
        <div class="particle" style="left:65%; top:75%; animation-delay:1.6s;"></div>
        <div class="particle" style="left:25%; top:85%; animation-delay:2.3s;"></div>
      </div>
      <div class="char-label"><span class="dot"></span>CORONEL DEADPOOL</div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <iframe src="https://reactive.fugi.tech/basic/359909509369692162" title="Coronel Deadpool reactivo" allowtransparency="true"></iframe>
    </div>

    <div class="username-chip clip-tl-br">
      <span>XAVODRAW</span>
    </div>

    <div class="tracker-dock clip-both">
      <div class="tron-grid">
        <div class="particle" style="left:20%; top:30%; animation-delay:.4s;"></div>
        <div class="particle" style="left:78%; top:60%; animation-delay:1.9s;"></div>
      </div>
      <div class="dock-label"><span class="dot"></span>LIVE STATS</div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>

  </div>

<script>
  if (new URLSearchParams(location.search).get('preview') === '1') {
    document.body.classList.add('preview');
    const guide = document.createElement('div');
    guide.innerHTML = `
      <div style="position:absolute;top:0;left:0;right:0;height:403px;background:repeating-linear-gradient(45deg,rgba(255,0,60,0.12),rgba(255,0,60,0.12) 10px,transparent 10px,transparent 20px);border-bottom:2px dashed rgba(255,0,60,0.7);z-index:99;"></div>
      <div style="position:absolute;top:403px;left:10px;color:#ff3355;font:12px monospace;z-index:99;">TIKTOK HEADER (reservado)</div>
      <div style="position:absolute;top:1037px;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,0,60,0.12),rgba(255,0,60,0.12) 10px,transparent 10px,transparent 20px);border-top:2px dashed rgba(255,0,60,0.7);z-index:99;"></div>
      <div style="position:absolute;top:1012px;left:10px;color:#ff3355;font:12px monospace;z-index:99;">CHAT / COMENTARIOS (reservado)</div>
    `;
    document.querySelector('.stage').appendChild(guide);
  }
</script>
</body>
</html>
